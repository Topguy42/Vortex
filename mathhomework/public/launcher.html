<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Vortex Proxy Launcher</title>
    <meta name="description" content="Single-file launcher that opens the Vortex proxy UI hosted on this server." />
    <style>
      html, body { height: 100%; margin: 0; background: #000; }
      .frame-container { position: fixed; inset: 0; }
      .proxy-frame { width: 100%; height: 100%; border: 0; display: block; }
      .fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="frame-container">
      <div id="fallback" class="fallback">Loading proxy…</div>
      <iframe id="proxyFrame" class="proxy-frame" title="Vortex Proxy"></iframe>
    </div>

    <script>
      (function () {
        // Point the iframe at the root of this server which hosts the proxy backend and UI
        var frame = document.getElementById('proxyFrame');
        var fallback = document.getElementById('fallback');
        // Use absolute origin so this file works from any path on this host
        frame.src = '/index-fixed.html?from=launcher';
        frame.addEventListener('load', function () { fallback.classList.add('hidden'); });
      })();
    </script>
  </body>
</html>
